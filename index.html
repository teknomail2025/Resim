    <script>
      // Silence Vite HMR WebSocket connection errors in sandboxed iframe environment
      (function() {
        if (typeof window !== 'undefined') {
          // Wrap console.error to filter out the Vite WebSocket error
          var origError = console.error;
          console.error = function() {
            var msg = Array.prototype.slice.call(arguments).map(function(a) {
              return (a && a.stack) ? a.stack : String(a || '');
            }).join(' ');
            if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('@vite/client') !== -1) {
              return;
            }
            origError.apply(console, arguments);
          };

          // Wrap window.WebSocket to suppress unhandled error bubbles
          if (window.WebSocket) {
            var OrigWS = window.WebSocket;
            window.WebSocket = function(url, protocols) {
              var ws;
              try {
                ws = protocols ? new OrigWS(url, protocols) : new OrigWS(url);
              } catch (e) {
                // Return dummy event target if constructor fails
                ws = { addEventListener: function() {}, removeEventListener: function() {}, close: function() {}, send: function() {} };
                return ws;
              }
              ws.addEventListener('error', function(e) {
                if (e && e.stopImmediatePropagation) e.stopImmediatePropagation();
              });
              return ws;
            };
            window.WebSocket.prototype = OrigWS.prototype;
          }

          window.addEventListener('error', function(event) {
            var msg = event && (event.message || '');
            var filename = event && (event.filename || '');
            if (msg.indexOf('WebSocket') !== -1 || filename.indexOf('@vite/client') !== -1) {
              event.stopImmediatePropagation();
              event.preventDefault();
              return true;
            }
          }, true);

          window.addEventListener('unhandledrejection', function(event) {
            var reason = event && (event.reason ? (event.reason.message || event.reason.stack || String(event.reason)) : '');
            if (reason.indexOf('WebSocket') !== -1 || reason.indexOf('@vite/client') !== -1) {
              event.stopImmediatePropagation();
              event.preventDefault();
              return true;
            }
          }, true);
        }
      })();
    </script>
