<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>
  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <rect x="24" y="24" width="464" height="464" rx="96" fill="none" stroke="#1e293b" stroke-width="8" />

  <!-- Camera / Frame outline -->
  <rect x="96" y="128" width="320" height="256" rx="36" fill="none" stroke="url(#primary)" stroke-width="24" />
  <circle cx="256" cy="256" r="64" fill="none" stroke="url(#primary)" stroke-width="20" />
  
  <!-- Language Translation Sparkle / Badge -->
  <circle cx="360" cy="180" r="28" fill="#10b981" />
  <text x="360" y="190" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="28" fill="#020617" text-anchor="middle">TR</text>
  
  <!-- Subtle scanline -->
  <line x1="96" y1="256" x2="416" y2="256" stroke="#38bdf8" stroke-width="4" stroke-dasharray="12 8" opacity="0.7"/>
</svg>
